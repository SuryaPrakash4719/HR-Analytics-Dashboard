<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Analytics Dashboard-Login</title>

    <link rel="stylesheet" href= "{{url_for('static', filename='style.css') }}">
</head>

<body class="login-page">
    <div class="login-container">


        <!-- Right Side -->
        <div class="login-right">
            <h1>Welcome Back</h1>
            <p class="Welcome-text">Login to access your HR Analytics Dashboard</p>

            <!-- Login Card -->
            <div class="login-box">
                <div class="lock-icon">
                    <img src="{{ url_for('static', filename='lock23.png') }}"></div>
                <h2>Login to your Account</h2>
                <p>Please enter your credentials to continue</p>

                <form id="loginForm">
                    <!-- Username -->
                    <label for="username">Username</label>

                    <input type="text" id="username" name="username" placeholder="Enter your username">

                    <!-- Password -->
                    <label for="password">Password</label>
                    <div class="password-box">
                        <input type="password" id="password" name="password" placeholder="Enter your password">

                        <button type="button" id="showPassword"><img id="passwordIcon" src="{{ url_for('static', filename='eyeof.png') }}" alt="Show Password"></button>
                        
                    </div>

                    <!-- Remember / Forgot -->
                    <div class="login-option">
                        <label>
                            <input type="checkbox" id="remember">
                            Remember
                        </label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="login-btn"><img src="{{ url_for('static', filename='login icon.png') }}">Login</button>

                    <!-- OR -->
                    <div class="or-line">
                        <span>or</span>
                    </div>

                    <!-- Demo Login -->
                    <button type="button" class="demo-btn" id="demoLogin"><img src="{{ url_for('static', filename='person1.png') }}"> Login as Demo</button>

                </form>
            </div>

            <!-- Footer -->
            <footer>@ 2026 HR Analytics Dashboard. All rights reserved</footer>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    
</body>
</html>
